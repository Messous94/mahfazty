<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="محفظتي" />
  <title>محفظتي v7 - إدارة المصاريف والبواقي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-alt: #f8fafc;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --primary: #4f46e5;
      --success: #10b981;
      --success-soft: rgba(16, 185, 129, 0.12);
      --danger: #ef4444;
      --danger-soft: rgba(239, 68, 68, 0.12);
      --warning: #f59e0b;
      --warning-soft: rgba(245, 158, 11, 0.14);
      --shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.06);
      --radius: 18px;
      --nav-height: 68px;
    }

    body.dark {
      --bg: #0b1120;
      --surface: #1e293b;
      --surface-alt: #0f172a;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --primary: #6366f1;
      --success-soft: rgba(16, 185, 129, 0.18);
      --danger-soft: rgba(239, 68, 68, 0.18);
      --warning-soft: rgba(245, 158, 11, 0.2);
      --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: calc(var(--nav-height) + 28px); transition: background 0.2s, color 0.2s; }

    .app-header { position: sticky; top: 0; z-index: 40; background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon { width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(135deg, #4f46e5, #06b6d4); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 18px; }
    .brand-title { font-size: 17px; font-weight: 800; line-height: 1.1; }
    .brand-sub { font-size: 11px; color: var(--text-muted); }
    .header-actions { display: flex; align-items: center; gap: 6px; }

    .sync-pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid var(--border); background: var(--surface-alt); color: var(--text); cursor: pointer; }
    .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warning); }
    .sync-dot.online { background: var(--success); box-shadow: 0 0 8px var(--success); }
    .sync-dot.error { background: var(--danger); }

    .icon-btn { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-alt); color: var(--text); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; }

    .month-bar { max-width: 1100px; margin: 12px auto 0; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .month-switcher { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 4px 8px; flex: 1; justify-content: space-between; box-shadow: var(--shadow); }
    .month-switcher select { background: transparent; border: none; color: var(--text); font-size: 15px; font-weight: 800; text-align: center; outline: none; cursor: pointer; }
    .month-nav-btn { width: 34px; height: 34px; border-radius: 10px; border: none; background: var(--surface-alt); color: var(--text); font-weight: 800; cursor: pointer; }
    .new-month-btn { padding: 10px 14px; border-radius: 14px; border: none; background: var(--primary); color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }

    .container { max-width: 1100px; margin: 14px auto; padding: 0 14px; }
    .view-section { display: none; }
    .view-section.active { display: block; }

    @media (min-width: 900px) {
      body { padding-bottom: 32px; }
      .bottom-nav, .fab-btn { display: none !important; }
      .desktop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
      .view-section { display: block !important; }
      .span-2 { grid-column: span 2; }
    }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .card-title { font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 8px; }

    .hero-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .metric-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); }
    .metric-box.cash { background: linear-gradient(135deg, #0f172a, #1e293b); color: #fff; border: none; grid-column: span 2; }
    .metric-label { font-size: 12px; opacity: 0.8; font-weight: 600; margin-bottom: 4px; }
    .metric-value { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
    .metric-box:not(.cash) .metric-value { font-size: 21px; }
    .metric-sub { font-size: 11px; margin-top: 4px; opacity: 0.75; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-full { grid-column: span 2; }
    label { display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 5px; }
    input, select { width: 100%; height: 46px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-alt); color: var(--text); font-size: 16px; font-weight: 600; outline: none; }
    input:focus, select:focus { border-color: var(--primary); }

    .btn { height: 46px; padding: 0 16px; border-radius: 12px; border: none; font-size: 14px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-primary { background: var(--primary); color: #fff; width: 100%; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-ghost { background: var(--surface-alt); color: var(--text); border: 1px solid var(--border); }

    .stepper { display: flex; align-items: center; gap: 8px; background: var(--surface-alt); border: 1px solid var(--border); border-radius: 12px; padding: 4px; height: 46px; }
    .stepper button { width: 38px; height: 36px; border-radius: 9px; border: none; background: var(--surface); color: var(--text); font-size: 18px; font-weight: 800; cursor: pointer; }
    .stepper span { flex: 1; text-align: center; font-weight: 800; font-size: 16px; }

    .item-list { display: flex; flex-direction: column; gap: 10px; }
    .list-card { background: var(--surface-alt); border: 1px solid var(--border); border-radius: 14px; padding: 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .list-info { flex: 1; min-width: 0; }
    .list-title { font-size: 14px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .list-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .list-amount { font-size: 15px; font-weight: 800; white-space: nowrap; }
    .amt-expense { color: var(--danger); }
    .amt-income { color: var(--success); }

    .badge { display: inline-block; padding: 2px 8px; border-radius: 8px; font-size: 11px; font-weight: 700; }
    .badge-paid { background: var(--success-soft); color: var(--success); }
    .badge-unpaid { background: var(--warning-soft); color: var(--warning); }

    .mini-actions { display: flex; gap: 4px; }
    .mini-btn { padding: 6px 9px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 12px; font-weight: 700; cursor: pointer; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: var(--nav-height); background: var(--surface); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 50; padding-bottom: env(safe-area-inset-bottom); }
    .nav-item { flex: 1; height: 100%; border: none; background: transparent; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 700; cursor: pointer; }
    .nav-item .nav-icon { font-size: 19px; line-height: 1; }
    .nav-item.active { color: var(--primary); }

    .fab-btn { position: fixed; bottom: calc(var(--nav-height) + 14px); left: 16px; width: 54px; height: 54px; border-radius: 50%; background: linear-gradient(135deg, #4f46e5, #06b6d4); color: #fff; border: none; font-size: 28px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(79, 70, 229, 0.4); cursor: pointer; z-index: 45; }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(3px); display: none; align-items: flex-end; justify-content: center; z-index: 100;
